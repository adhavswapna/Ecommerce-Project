map $http_origin $cors_origin {
    default "";
    "http://localhost:3000" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://localhost:5174" $http_origin;
}

server {
    listen 8081;
    server_name localhost;

    # ---------------------------------
    # GLOBAL CORS
    # ---------------------------------

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }


    # =========================
    # AUTH
    # =========================

    location /api/auth/ {
        proxy_pass http://auth_service/auth/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # ADMIN
    # =========================

    location /api/admin/ {
        proxy_pass http://admin_service/admin/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================
    # PRODUCTS
    # =========================

    location /api/products/ {
        proxy_pass http://product_service/products/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/products/health {
        proxy_pass http://product_service/health;
    }

    # =========================
    # CART
    # =========================

    location /api/cart/ {
        proxy_pass http://cart_service/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================
    # ORDERS
    # =========================

    location /api/orders/ {
        proxy_pass http://order_service/orders/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # PAYMENT
    # =========================

    location /api/payment/ {
        proxy_pass http://payment_service/payments/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # =========================
    # USERS
    # =========================

    location /api/users/ {
        proxy_pass http://user_service/users/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================
    # EMAIL
    # =========================

    location /api/email/ {
        rewrite ^/api/email/?(.*)$ /$1 break;
        proxy_pass http://email_service;
        proxy_http_version 1.1;
    }

    # =========================
    # RATINGS
    # =========================

    location /api/ratings/ {
        proxy_pass http://rating_service/ratings/;
        proxy_http_version 1.1;
    }

    # =========================
    # INVENTORY
    # =========================

    location /api/inventory/ {
        proxy_pass http://inventory_service/inventory/;
        proxy_http_version 1.1;
    }

    # =========================
    # INVOICES
    # =========================

    location /api/invoices/ {
        proxy_pass http://invoice_service/invoices/;
        proxy_http_version 1.1;
    }

    # =========================
    # ANALYTICS
    # =========================

    location /api/analytics/ {
        rewrite ^/api/analytics/?(.*)$ /$1 break;
        proxy_pass http://analytics_service/;
        proxy_http_version 1.1;
    }

    # =========================
    # VENDORS
    # =========================

    location /api/vendors/ {
        proxy_pass http://vendor_service/vendors/;
        proxy_http_version 1.1;
    }

    location = /api/vendors/health {
        proxy_pass http://vendor_service/health;
    }

    # =========================
    # SEARCH
    # =========================

    location /api/search/ {
        proxy_pass http://search_service/;
        proxy_http_version 1.1;
    }

    # =========================
    # SHIPPING
    # =========================

    location /api/shipping/ {
        rewrite ^/api/shipping/?(.*)$ /$1 break;
        proxy_pass http://shipping_service;
        proxy_http_version 1.1;
    }

    # =========================
    # REFUNDS
    # =========================

    location /api/refunds/ {
        rewrite ^/api/refunds/?(.*)$ /$1 break;
        proxy_pass http://refund_service;
        proxy_http_version 1.1;
    }

    # =========================
    # NOTIFICATIONS
    # =========================

    location /api/notifications/ {
        rewrite ^/api/notifications/?(.*)$ /$1 break;
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
    }

    # =========================
    # HEALTH
    # =========================

    location = /health {
        default_type text/plain;
        return 200 "NGINX Gateway OK\n";
    }

    location = / {
        default_type text/plain;
        return 200 "API Gateway Running\n";
    }
}
