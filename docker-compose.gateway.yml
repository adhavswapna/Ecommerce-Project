services:
  api-gateway:
    image: nginx:alpine
    container_name: ecommerce-api-gateway
    ports:
      - "8081:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: ecommerce-net
    external: true
